<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: rgba(255,255,255,.92);
    background: #0b1026;
    display: flex; flex-direction: column;
    padding: clamp(1.5rem, 5vmin, 4rem);
    text-shadow: 0 1px 6px rgba(0,0,0,.18);
    user-select: none; cursor: none;
  }

  /* --- sky --- */
  #sky {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    transition: background 60s linear;
    background: linear-gradient(#1a2340, #2c3a5c); /* repainted by JS */
  }
  #orb {
    position: absolute; width: 9vmin; height: 9vmin; border-radius: 50%;
    transition: left 60s linear, top 60s linear, background 60s linear, box-shadow 60s linear;
  }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: 0;
    animation: twinkle 5s ease-in-out infinite;
    transition: opacity 20s;
  }
  body.night .star { opacity: .8; }
  @keyframes twinkle { 50% { opacity: .25; } }
  .cloud {
    position: absolute; border-radius: 50px;
    background: rgba(255,255,255,.16); filter: blur(6px);
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateX(-30vw); }
    to   { transform: translateX(130vw); }
  }

  /* --- content --- */
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  #clock { font-size: clamp(3rem, 12vmin, 8rem); font-weight: 200; letter-spacing: .02em; line-height: 1; }
  #date  { margin-top: .8rem; font-size: clamp(1rem, 2.6vmin, 1.5rem); font-weight: 300; opacity: .85; }
  #weather { text-align: right; font-weight: 300; margin-top: .6rem; }
  #temp { font-size: clamp(2rem, 7vmin, 4.5rem); font-weight: 200; line-height: 1; }
  #wlabel { opacity: .85; margin-top: .4rem; font-size: clamp(.9rem, 2.2vmin, 1.2rem); }
  #range { opacity: .6; font-size: clamp(.8rem, 2vmin, 1rem); margin-top: .2rem; }

  main { flex: 1; display: flex; align-items: flex-end; gap: 8vmin; padding-bottom: 2vmin; }
  section { flex: 1; max-width: 34rem; }
  h2 {
    font-size: clamp(.75rem, 1.8vmin, .95rem); font-weight: 500;
    letter-spacing: .25em; text-transform: uppercase; opacity: .6;
    margin-bottom: 1.2rem;
  }
  ul { list-style: none; }
  li {
    font-size: clamp(1rem, 2.8vmin, 1.5rem); font-weight: 300;
    margin: .9rem 0; display: flex; gap: .9rem; align-items: baseline;
    opacity: 0; animation: settle 2s ease forwards;
  }
  li:nth-child(2) { animation-delay: .3s; } li:nth-child(3) { animation-delay: .6s; }
  li:nth-child(4) { animation-delay: .9s; } li:nth-child(5) { animation-delay: 1.2s; }
  @keyframes settle { to { opacity: 1; } }
  .time { font-variant-numeric: tabular-nums; opacity: .65; font-size: .8em; min-width: 3.2em; }
  li.done { opacity: 0; animation: settle 2s ease forwards; }
  li.done span:last-child { text-decoration: line-through; opacity: .45; }
  .dot { opacity: .5; }
  .empty { opacity: .5; font-style: italic; }
</style>
</head>
<body>
<div id="sky"><div id="orb"></div></div>

<header>
  <div>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>
  <div id="weather">
    <div id="temp"></div>
    <div id="wlabel"></div>
    <div id="range"></div>
  </div>
</header>

<main>
  <section>
    <h2>Today</h2>
    <ul id="events"><li class="empty">…</li></ul>
  </section>
  <section>
    <h2>Tasks</h2>
    <ul id="tasks"><li class="empty">…</li></ul>
  </section>
</main>

<script>
/* ---------- sky: color, sun/moon, stars, clouds ---------- */
const sky = document.getElementById('sky');
const orb = document.getElementById('orb');

// [topColor, bottomColor] keyframes around the clock
const SKY = [
  [0,  '#0b1026', '#1a2340'], [4,  '#0e1530', '#2a2c50'],
  [6,  '#40498e', '#e8a87c'], [8,  '#7ec8e3', '#cfe8f5'],
  [12, '#5aa9e6', '#bfe0f2'], [16, '#6aa5d8', '#f2d0a4'],
  [19, '#3d3b6e', '#e8875f'], [21, '#141a38', '#2c3057'],
  [24, '#0b1026', '#1a2340'],
];
const lerp = (a, b, t) => a + (b - a) * t;
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, t) => {
  const [a, b] = [hex2rgb(h1), hex2rgb(h2)];
  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`;
};

function paintSky() {
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  let i = 0;
  while (SKY[i + 1][0] <= h) i++;
  const [h0, t0, b0] = SKY[i], [h1, t1, b1] = SKY[i + 1];
  const t = (h - h0) / (h1 - h0);
  sky.style.background =
    `linear-gradient(${mix(t0, t1, t)}, ${mix(b0, b1, t)})`;

  const isDay = h >= 6 && h < 19;
  document.body.classList.toggle('night', !isDay);

  // Arc across the sky: sun 6→19, moon 19→6
  const span = isDay ? (h - 6) / 13 : ((h + 24 - 19) % 24) / 11;
  const x = 8 + span * 84;                       // vw
  const y = 62 - Math.sin(span * Math.PI) * 48;  // vh
  orb.style.left = x + 'vw';
  orb.style.top = y + 'vh';
  orb.style.background = isDay ? '#fff3c4' : '#e8ecf5';
  orb.style.boxShadow = isDay
    ? '0 0 12vmin 4vmin rgba(255,236,170,.55)'
    : '0 0 8vmin 2vmin rgba(220,228,255,.35)';
}

for (let i = 0; i < 60; i++) {           // stars
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 55 + 'vh';
  s.style.animationDelay = Math.random() * 5 + 's';
  sky.appendChild(s);
}
for (let i = 0; i < 4; i++) {            // slow clouds
  const c = document.createElement('div');
  c.className = 'cloud';
  c.style.width = 18 + Math.random() * 18 + 'vmin';
  c.style.height = 4 + Math.random() * 3 + 'vmin';
  c.style.top = 5 + Math.random() * 30 + 'vh';
  c.style.animationDuration = 240 + Math.random() * 240 + 's';
  c.style.animationDelay = -Math.random() * 300 + 's';
  sky.appendChild(c);
}

/* ---------- clock ---------- */
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('date').textContent =
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

/* ---------- data ---------- */
function fill(listId, items, render, emptyText) {
  const ul = document.getElementById(listId);
  ul.innerHTML = '';
  if (!items.length) {
    ul.innerHTML = `<li class="empty">${emptyText}</li>`;
    return;
  }
  for (const item of items.slice(0, 5)) ul.appendChild(render(item));
}

async function refresh() {
  try {
    const data = await (await fetch('/api/data')).json();

    fill('events', data.events, e => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="time">${e.time || 'all day'}</span><span></span>`;
      li.lastChild.textContent = e.summary;
      return li;
    }, 'a quiet day — nothing scheduled');

    fill('tasks', data.tasks, t => {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      li.innerHTML = `<span class="dot">${t.done ? '·' : '○'}</span><span></span>`;
      li.lastChild.textContent = t.text;
      return li;
    }, 'nothing to do');

    const w = data.weather;
    if (w.ok) {
      document.getElementById('temp').textContent = `${w.temperature}°`;
      document.getElementById('wlabel').textContent = w.label;
      document.getElementById('range').textContent = `${w.high}° / ${w.low}°`;
    } else {
      document.getElementById('wlabel').textContent = '';
    }
  } catch { /* server briefly unreachable — keep the last scene */ }
}

paintSky(); tick(); refresh();
setInterval(paintSky, 60 * 1000);        // sky repaints every minute
setInterval(tick, 5 * 1000);
setInterval(refresh, 5 * 60 * 1000);     // data refreshes every 5 minutes
</script>
</body>
</html>
