<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f7f2"/><stop offset="1" stop-color="#eef3ef"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1aa39c"/><stop offset="1" stop-color="#167d78"/>
    </linearGradient>
    <linearGradient id="coral" x1="48" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2685f"/><stop offset="1" stop-color="#bf4d45"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f7f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#167d78" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="470" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="40" r="150" fill="#e0f2ef" opacity="0.6"/>
  <circle cx="120" cy="450" r="150" fill="#fae7e2" opacity="0.5"/>

  <!-- ===== Left column: wordmark + tagline + pills ===== -->
  <g transform="translate(72 96)">
    <!-- logo -->
    <g transform="translate(0 -22)">
      <rect x="-2" y="-2" width="56" height="56" rx="15" fill="#fff" stroke="#e7e3d6"/>
      <circle cx="20" cy="26" r="15" fill="url(#teal)" opacity="0.92"/>
      <circle cx="34" cy="26" r="15" fill="url(#coral)" opacity="0.82"/>
      <path d="M27 33c-3.7-2.7-6.2-4.6-6.2-7.3 0-1.8 1.4-3.1 3.1-3.1 1.1 0 2.2.6 3.1 1.7.9-1.1 2-1.7 3.1-1.7 1.7 0 3.1 1.3 3.1 3.1 0 2.7-2.5 4.6-6.2 7.3z" fill="#fff"/>
    </g>
    <text x="76" y="22" font-size="40" font-weight="700" fill="#252521">Couple Lab</text>

    <text x="0" y="104" font-size="33" font-weight="700" fill="#252521">A calm place to</text>
    <text x="0" y="146" font-size="33" font-weight="700" fill="#167d78">practice connection.</text>

    <text x="0" y="196" font-size="18" fill="#5b6157">Guided conversation decks, gentle pattern</text>
    <text x="0" y="222" font-size="18" fill="#5b6157">feedback, and progress over time — private,</text>
    <text x="0" y="248" font-size="18" fill="#5b6157">local-first, and never a verdict.</text>

    <!-- feature pills -->
    <g font-size="15" font-weight="600">
      <g transform="translate(0 286)">
        <rect width="186" height="40" rx="20" fill="#fff" stroke="#dfe6df"/>
        <circle cx="24" cy="20" r="6" fill="#167d78"/>
        <text x="42" y="25" fill="#3a4038">Gottman-inspired decks</text>
      </g>
      <g transform="translate(202 286)">
        <rect width="150" height="40" rx="20" fill="#fff" stroke="#dfe6df"/>
        <circle cx="24" cy="20" r="6" fill="#bf4d45"/>
        <text x="42" y="25" fill="#3a4038">Repair &amp; bids</text>
      </g>
      <g transform="translate(0 338)">
        <rect width="168" height="40" rx="20" fill="#fff" stroke="#dfe6df"/>
        <circle cx="24" cy="20" r="6" fill="#c28b21"/>
        <text x="42" y="25" fill="#3a4038">No account, no server</text>
      </g>
      <g transform="translate(184 338)">
        <rect width="168" height="40" rx="20" fill="#fff" stroke="#dfe6df"/>
        <circle cx="24" cy="20" r="6" fill="#7351a5"/>
        <text x="42" y="25" fill="#3a4038">Consent-first by design</text>
      </g>
    </g>
  </g>

  <!-- ===== Right column: faux app window ===== -->
  <g transform="translate(640 56)" filter="url(#shadow)">
    <rect width="492" height="358" rx="18" fill="url(#card)" stroke="#e7e3d6"/>
    <!-- window dots -->
    <circle cx="26" cy="26" r="5" fill="#d2685f"/>
    <circle cx="44" cy="26" r="5" fill="#e0b94e"/>
    <circle cx="62" cy="26" r="5" fill="#7bbf6a"/>

    <!-- welcome-hero card inside -->
    <g transform="translate(24 50)">
      <rect width="444" height="150" rx="14" fill="#f3f7f4" stroke="#e3ece6"/>
      <text x="22" y="38" font-size="12" font-weight="700" letter-spacing="1.2" fill="#167d78">COUPLE LAB</text>
      <text x="22" y="68" font-size="20" font-weight="700" fill="#252521">Welcome back</text>
      <text x="22" y="94" font-size="13" fill="#6b7167">Pick a deck and press record</text>
      <text x="22" y="113" font-size="13" fill="#6b7167">when you're ready.</text>
      <!-- mini couple illustration -->
      <g transform="translate(300 26)">
        <path d="M14 92 C40 36 88 36 114 92" stroke="#c28b21" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" fill="none"/>
        <circle cx="64" cy="34" r="4" fill="#7351a5"/>
        <circle cx="26" cy="64" r="16" fill="#167d78"/>
        <path d="M2 104c0-14 11-24 24-24s24 10 24 24z" fill="#167d78" opacity="0.9"/>
        <circle cx="102" cy="64" r="16" fill="#bf4d45"/>
        <path d="M78 104c0-14 11-24 24-24s24 10 24 24z" fill="#bf4d45" opacity="0.9"/>
        <path d="M64 86c-4-3-6.7-5.1-6.7-8 0-2 1.5-3.4 3.4-3.4 1.3 0 2.4.7 3.3 2 .9-1.3 2-2 3.3-2 1.9 0 3.4 1.4 3.4 3.4 0 2.9-2.7 5-6.7 8z" fill="#fff"/>
      </g>
    </g>

    <!-- stat chips -->
    <g transform="translate(24 216)">
      <g>
        <rect width="138" height="58" rx="12" fill="#fff" stroke="#e7e3d6"/>
        <text x="16" y="26" font-size="11" font-weight="600" fill="#8a9088">WARMTH</text>
        <text x="16" y="48" font-size="20" font-weight="700" fill="#167d78">Rising</text>
      </g>
      <g transform="translate(153 0)">
        <rect width="138" height="58" rx="12" fill="#fff" stroke="#e7e3d6"/>
        <text x="16" y="26" font-size="11" font-weight="600" fill="#8a9088">REPAIR</text>
        <text x="16" y="48" font-size="20" font-weight="700" fill="#c28b21">Faster</text>
      </g>
      <g transform="translate(306 0)">
        <rect width="138" height="58" rx="12" fill="#fff" stroke="#e7e3d6"/>
        <text x="16" y="26" font-size="11" font-weight="600" fill="#8a9088">SESSIONS</text>
        <text x="16" y="48" font-size="20" font-weight="700" fill="#7351a5">7 saved</text>
      </g>
    </g>

    <!-- deck row -->
    <g transform="translate(24 290)">
      <rect width="444" height="44" rx="12" fill="#167d78"/>
      <text x="22" y="28" font-size="15" font-weight="600" fill="#fff">Start a Love Maps conversation</text>
      <circle cx="416" cy="22" r="13" fill="#ffffff" opacity="0.18"/>
      <path d="M412 22h8M416 18v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
